name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Set up uv for the shared spelling gate
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          python-version: '3.14.7'
      - name: Install Markdown formatter from a prebuilt release
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ff1dd759dfffc0db3459e30e833f52437ee62b57 # reviewed baseline
        with:
          version: '0.6.1'
      - name: Install frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Commit gates
        run: make all
      - name: Generated JavaScript coverage
        run: make coverage
      - name: Upload LCOV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-js-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
      # Keep coverage evidence even when an advisory has no upstream fix.
      # An unrelated advisory must not deadlock Dependabot remediation PRs.
      - name: Advisory audit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: make audit
